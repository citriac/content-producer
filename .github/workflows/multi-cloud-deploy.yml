name: Daily Content & Deploy

on:
  schedule:
    - cron: '0 23 * * *'  # UTC 23:00 = 北京时间 07:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install psutil requests

      - name: Generate daily content
        run: |
          python generator.py
          python analyzer.py
          python build_site.py

      - name: Verify build output
        run: |
          test -f docs/index.html && echo "✅ index.html exists" || echo "⚠️ index.html missing"
          test -f docs/data/latest.json && echo "✅ latest.json exists" || echo "⚠️ latest.json missing"

      - name: Commit and push changes
        run: |
          git config user.name "Clavis"
          git config user.email "mindon@outlook.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            DATE=$(date +'%Y-%m-%d')
            git commit -m "auto: daily report ${DATE}"
            git push
          fi

      - name: Summary
        run: |
          echo "## Daily Content Generated ✅" >> $GITHUB_STEP_SUMMARY
          echo "Date: $(date +'%Y-%m-%d')" >> $GITHUB_STEP_SUMMARY
          echo "Content available at: https://citriac.github.io/daily.html" >> $GITHUB_STEP_SUMMARY
