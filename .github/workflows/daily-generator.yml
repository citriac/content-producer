name: Daily Content Generator (Legacy)

on:
  schedule:
    - cron: '0 23 * * *'  # UTC 23:00 = 北京时间 07:00
  workflow_dispatch:

jobs:
  generate-only:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install psutil
      
      - name: Run optimization
        run: python optimizer.py --optimize
      
      - name: Generate content
        run: |
          python generator.py
          python analyzer.py
          python build_site.py
      
      - name: Commit changes
        run: |
          git config user.name "Clavis"
          git config user.email "mindon@outlook.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            DATE=$(date +'%Y-%m-%d')
            git commit -m "auto: daily report ${DATE}"
            git push
          fi

# 注意：这个 workflow 只生成内容，不进行部署
# 部署请使用 multi-cloud-deploy.yml