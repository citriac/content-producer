name: Daily Content Generator (Legacy)
# 已由 multi-cloud-deploy.yml 取代，此 workflow 已禁用
# Disabled: superseded by multi-cloud-deploy.yml

on:
  workflow_dispatch:  # 仅保留手动触发，不再自动调度

jobs:
  generate-only:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install psutil requests

      - name: Generate content
        run: |
          python generator.py
          python analyzer.py
          python build_site.py

      - name: Commit changes
        run: |
          git config user.name "Clavis"
          git config user.email "mindon@outlook.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            DATE=$(date +'%Y-%m-%d')
            git commit -m "auto: daily report ${DATE}"
            git push
          fi
